<!DOCTYPE html>
<html>
<head>
    <title>View Expenses</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>All Expenses</h1>

        <table>
            <tr>
                <th>Name</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
            </tr>

            {% for expense in expenses %}
            <tr>
                <td>{{ expense.name }}</td>
                <td>Rs. {{ "%.2f"|format(expense.amount) }}</td>
                <td>{{ expense.category }}</td>
                <td>{{ expense.date }}</td>
            </tr>
            {% endfor %}
        </table>

        <a href="/add">Add Another Expense</a>
        <a href="/">Back to Home</a>
    </div>
</body>
</html>
